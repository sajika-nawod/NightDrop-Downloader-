<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightDrop Pro</title><link rel="stylesheet" href="style.css"></head><body>
<div class="orb o1"></div><div class="orb o2"></div>
<header><div class="logo"><i>↓</i> NightDrop <b>PRO</b></div><span>PRIVATE • FAST • LOCAL</span></header>
<main>
<section class="hero"><div class="tag">100% Free MEDIA DOWNLOADER</div><h1>Download it<br><em>your way.</em></h1><p>Preview the video, choose your quality, then launch a beautiful live download screen.</p>
<div class="bar"><input id="url" placeholder="Paste a video URL here..." type="url"><button id="preview">Preview ✦</button></div>
<div id="error"></div></section>

<section id="previewBox" class="preview hidden">
  <div class="thumb"><img id="thumb"><div class="play">▶</div></div>
  <div class="info"><label>VIDEO PREVIEW</label><h2 id="title">—</h2><p id="meta">—</p>
  <div class="row"><select id="quality"></select><select id="format"><option value="mp4">MP4 • Video</option><option value="mp3">MP3 • Audio</option></select><button id="go">DOWNLOAD ↓</button></div></div>
</section>
</main><footer> </footer>
<script src="app.js"></script></body></html>
